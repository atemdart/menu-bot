<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-label="Иллюстрации трёх сценариев бота Меню на демонстрационных данных"><title>Иллюстрации трёх сценариев бота Меню на демонстрационных данных</title><rect x="0" y="0" width="1280" height="820" rx="28" fill="#F8F5EE"/><text x="48" y="61" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#254C38">От выбора продуктов до готового блюда</text><text x="48" y="96" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#65766B">Три сценария использования бота</text><rect x="48" y="165" width="350" height="608" rx="33" fill="#233C30"/><rect x="55" y="172" width="336" height="594" rx="27" fill="#F3F6F1"/><rect x="55" y="172" width="336" height="77" rx="27" fill="#FFFFFF"/><rect x="55" y="214" width="336" height="35" rx="0" fill="#FFFFFF"/><circle cx="92" cy="210" r="18" fill="#DDEADD"/><text x="82" y="216" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#315F4B">М</text><text x="122" y="205" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#253B31">Меню</text><text x="122" y="225" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#78867F">бот</text><text x="64" y="143" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#315F4B">1. Продукты дома</text><rect x="465" y="165" width="350" height="608" rx="33" fill="#233C30"/><rect x="472" y="172" width="336" height="594" rx="27" fill="#F3F6F1"/><rect x="472" y="172" width="336" height="77" rx="27" fill="#FFFFFF"/><rect x="472" y="214" width="336" height="35" rx="0" fill="#FFFFFF"/><circle cx="509" cy="210" r="18" fill="#DDEADD"/><text x="499" y="216" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#315F4B">М</text><text x="539" y="205" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#253B31">Меню</text><text x="539" y="225" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#78867F">бот</text><text x="481" y="143" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#315F4B">2. Режим подбора</text><rect x="882" y="165" width="350" height="608" rx="33" fill="#233C30"/><rect x="889" y="172" width="336" height="594" rx="27" fill="#F3F6F1"/><rect x="889" y="172" width="336" height="77" rx="27" fill="#FFFFFF"/><rect x="889" y="214" width="336" height="35" rx="0" fill="#FFFFFF"/><circle cx="926" cy="210" r="18" fill="#DDEADD"/><text x="916" y="216" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#315F4B">М</text><text x="956" y="205" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#253B31">Меню</text><text x="956" y="225" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#78867F">бот</text><text x="898" y="143" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#315F4B">3. Готовые порции</text><rect x="66" y="267" width="314" height="94" rx="13" fill="#FFFFFF"/><text x="80" y="295" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#253B31">Овощи</text><text x="80" y="321" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#253B31">Отмечай, что есть дома.</text><text x="80" y="345" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#65766B">Запас можно указать отдельно.</text><rect x="66" y="375" width="314" height="43" rx="10" fill="#D5E9DC"/><text x="80" y="402" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#27543D">✓ Брокколи</text><rect x="66" y="426" width="314" height="43" rx="10" fill="#D5E9DC"/><text x="80" y="453" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#27543D">✓ Огурцы</text><rect x="66" y="477" width="314" height="43" rx="10" fill="#EFF4F0"/><text x="80" y="504" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#27543D">Кабачки</text><rect x="66" y="528" width="314" height="43" rx="10" fill="#EFF4F0"/><text x="80" y="555" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#27543D">Морковь</text><rect x="66" y="599" width="314" height="43" rx="10" fill="#EFF4F0"/><text x="80" y="626" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#27543D">Все категории</text><rect x="66" y="650" width="314" height="43" rx="10" fill="#EFF4F0"/><text x="80" y="677" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#27543D">Мои продукты</text><rect x="483" y="267" width="314" height="240" rx="13" fill="#FFFFFF"/><text x="497" y="297" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#253B31">Выбери режим меню</text><text x="497" y="336" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#315F4B">Только из того, что дома</text><text x="497" y="364" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#253B31">Блюда из отмеченных продуктов.</text><text x="497" y="408" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#315F4B">Можно докупить</text><text x="497" y="436" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#253B31">Меню с учётом запасов</text><text x="497" y="460" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#253B31">и список недостающего.</text><rect x="483" y="527" width="314" height="43" rx="10" fill="#D5E9DC"/><text x="497" y="554" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#27543D">Только из того, что дома</text><rect x="483" y="578" width="314" height="43" rx="10" fill="#EFF4F0"/><text x="497" y="605" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#27543D">Можно докупить</text><rect x="483" y="649" width="314" height="43" rx="10" fill="#EFF4F0"/><text x="497" y="676" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#27543D">Продукты дома</text><rect x="900" y="267" width="314" height="145" rx="13" fill="#FFFFFF"/><text x="914" y="297" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#253B31">Омлет с овощами</text><text x="914" y="335" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#253B31">Сколько порций приготовила?</text><text x="914" y="365" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#253B31">Продукты спишутся</text><text x="914" y="387" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#253B31">после выбора.</text><rect x="900" y="425" width="151" height="43" rx="10" fill="#D5E9DC"/><text x="914" y="452" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#27543D">1 порция</text><rect x="1063" y="425" width="151" height="43" rx="10" fill="#EFF4F0"/><text x="1077" y="452" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#27543D">3 порции</text><rect x="900" y="476" width="314" height="43" rx="10" fill="#EFF4F0"/><text x="914" y="503" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#27543D">Отмена</text><rect x="900" y="552" width="314" height="139" rx="13" fill="#FFFFFF"/><text x="914" y="583" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#315F4B">Приготовление записано</text><text x="914" y="610" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#253B31">на 1 порцию.</text><text x="914" y="643" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#65766B">Повторное нажатие защищено</text><text x="914" y="666" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#65766B">от повторного списания.</text><text x="48" y="803" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#6C7C71">Иллюстрации интерфейса. Демонстрационные данные.</text></svg>
